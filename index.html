<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nordly</title>
<meta name="description" content="Nordly: a calm compass, level and outdoor toolkit for Android and Wear OS.">
<style>
  :root { --bg: #fbfaff; --fg: #1b1b21; --muted: #5d5e6a; --accent: #5b4fc4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121318; --fg: #e4e1e9; --muted: #a9a8b5; --accent: #c4bfff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 48px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 600; margin: 0 0 12px; }
  h1 span { color: var(--accent); }
  p { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Nord<span>ly</span></h1>
  <p>A calm, precise compass, level and outdoor toolkit for Android and Wear OS. Works offline.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
